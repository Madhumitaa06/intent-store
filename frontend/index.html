<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntentStore</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #eee6d2;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
}

.page { width: 100%; min-height: 100vh; padding: 35px 3%; }

.title {
    text-align: center;
    font-size: 88px;
    font-weight: 900;
    letter-spacing: 5px;
    margin: 0;
}

.subtitle {
    text-align: center;
    margin-top: 42px;
    font-size: 31px;
    color: #31577d;
}

/* ---------- LOGIN / SIGNUP ---------- */

#authScreen { display: none; }

.auth-card {
    max-width: 520px;
    margin: 60px auto 0 auto;
    background: #f8f5ee;
    border: 1px solid #b8b0a1;
    border-radius: 30px;
    padding: 40px;
}

.auth-card h2 { margin: 0 0 25px 0; font-size: 34px; text-align: center; }

.auth-input {
    width: 100%;
    padding: 18px 22px;
    margin-bottom: 18px;
    border-radius: 20px;
    border: 1.5px solid #aaa;
    background: #fff;
    font-size: 22px;
    outline: none;
}

.auth-button {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 22px;
    background: #171717;
    color: white;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
}

.auth-button:disabled { opacity: 0.6; cursor: wait; }

.auth-switch {
    text-align: center;
    margin-top: 22px;
    font-size: 19px;
    color: #31577d;
    cursor: pointer;
    text-decoration: underline;
}

.auth-message {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 18px;
    display: none;
}

.auth-message.error { display: block; background: #f8d9d2; color: #9b2c20; }
.auth-message.success { display: block; background: #dcefdc; color: #256329; }

/* ---------- LOGOUT ---------- */

#appScreen { display: none; }

.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 18px; }

.user-email { font-size: 18px; color: #555; }

.logout-button {
    padding: 12px 26px;
    border-radius: 18px;
    border: 1.5px solid #aaa;
    background: #f4eee1;
    font-size: 18px;
    cursor: pointer;
}

.logout-button:hover { background: #eee5d4; }

/* ---------- SEARCH ---------- */

.search-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 500px 265px;
    gap: 20px;
    margin-top: 72px;
    align-items: stretch;
}

.question-input {
    width: 100%;
    min-height: 138px;
    padding: 30px 45px;
    border-radius: 30px;
    border: 1.5px solid #aaa;
    background: #f8f5ee;
    outline: none;
    font-size: 31px;
    color: #111;
}

.question-input::placeholder { color: #68788a; }
.question-input:focus { border-color: #777; }

.mode-select {
    width: 100%;
    min-height: 138px;
    padding: 0 35px;
    border-radius: 30px;
    border: 1.5px solid #aaa;
    background: #f8f5ee;
    font-size: 27px;
    color: #111;
    outline: none;
    cursor: pointer;
}

.search-button {
    min-height: 138px;
    border: none;
    border-radius: 30px;
    background: #171717;
    color: white;
    font-size: 29px;
    font-weight: 700;
    cursor: pointer;
    padding: 20px;
    transition: transform 0.15s ease, opacity 0.15s ease;
}

.search-button:hover { transform: translateY(-2px); }
.search-button:active { transform: translateY(0); }
.search-button:disabled { opacity: 0.6; cursor: wait; transform: none; }

.example-container { display: flex; justify-content: flex-end; margin-top: 36px; }

.example-button {
    min-width: 345px;
    min-height: 84px;
    padding: 15px 30px;
    border-radius: 28px;
    border: 1.5px solid #aaa;
    background: #f4eee1;
    color: #111;
    font-size: 26px;
    cursor: pointer;
}

.example-button:hover { background: #eee5d4; }

.status {
    width: 100%;
    margin-top: 38px;
    padding: 24px 32px;
    border-radius: 22px;
    border: 1px solid transparent;
    font-size: 23px;
    display: none;
}

.status.error { display: block; background: #f8d9d2; border-color: #e79b8d; color: #9b2c20; }
.status.success { display: block; background: #dcefdc; border-color: #9ac79a; color: #256329; }
.status.loading { display: block; background: #eee8d9; border-color: #c5bda9; color: #444; }

.results-section { margin-top: 48px; display: none; }
.results-section.visible { display: block; }
.results-title { font-size: 48px; font-weight: 800; margin: 0 0 28px 0; }

.answer-card {
    background: #f8f5ee;
    border: 1px solid #b8b0a1;
    border-radius: 25px;
    padding: 30px 35px;
    margin-bottom: 28px;
}

.answer-heading { font-size: 28px; font-weight: 700; margin-bottom: 18px; }
.answer-text { font-size: 23px; line-height: 1.6; white-space: pre-wrap; }

.evidence-card {
    background: #f8f5ee;
    border: 1px solid #b8b0a1;
    border-radius: 22px;
    padding: 26px 30px;
    margin-bottom: 20px;
}

.document-name { font-size: 25px; font-weight: 700; margin-bottom: 12px; }
.document-info { font-size: 18px; color: #555; margin-bottom: 16px; }
.evidence-text { font-size: 20px; line-height: 1.55; white-space: pre-wrap; }

.document-result {
    background: #f8f5ee;
    border: 1px solid #b8b0a1;
    border-radius: 25px;
    padding: 30px 35px;
    margin-bottom: 25px;
}

.document-result h3 { margin: 0 0 15px 0; font-size: 28px; }
.document-result p { font-size: 21px; line-height: 1.6; margin: 8px 0; }

.no-results {
    background: #f8f5ee;
    border: 1px solid #b8b0a1;
    border-radius: 22px;
    padding: 30px;
    font-size: 22px;
}

@media (max-width: 1200px) {
    .search-row { grid-template-columns: minmax(0, 1fr) 380px 220px; }
    .title { font-size: 70px; }
    .subtitle { font-size: 26px; }
}

@media (max-width: 900px) {
    .search-row { grid-template-columns: 1fr; }
    .title { font-size: 55px; }
    .subtitle { font-size: 23px; }
    .example-container { justify-content: flex-start; }
    .question-input, .mode-select, .search-button { min-height: 100px; }
}
</style>
</head>

<body>
<div class="page">

    <h1 class="title">INTENTSTORE</h1>
    <div class="subtitle">Intelligent document storage and retrieval</div>

    <!-- =========================================================
         LOGIN / SIGNUP SCREEN
         ========================================================= -->
    <div id="authScreen">
        <div class="auth-card">
            <h2 id="authHeading">Log in</h2>

            <input id="authEmail" class="auth-input" type="email"
                   placeholder="Email" autocomplete="username">

            <input id="authPassword" class="auth-input" type="password"
                   placeholder="Password" autocomplete="current-password">

            <button id="authButton" class="auth-button" type="button">Log in</button>

            <div id="authMessage" class="auth-message"></div>

            <div id="authSwitch" class="auth-switch">
                New here? Create an account
            </div>
        </div>
    </div>

    <!-- =========================================================
         MAIN APP (only visible when logged in)
         ========================================================= -->
    <div id="appScreen">

        <div class="topbar">
            <span id="userEmail" class="user-email"></span>
            <button id="logoutButton" class="logout-button" type="button">Log out</button>
        </div>

        <div class="search-row">
            <input id="questionInput" class="question-input" type="text"
                   autocomplete="off" placeholder="Search your knowledge base...">

            <select id="modeSelect" class="mode-select">
                <option value="information">🔎 Information Retrieval</option>
                <option value="document">📄 Document Retrieval</option>
            </select>

            <button id="searchButton" class="search-button" type="button">Search</button>
        </div>

        <div id="exampleContainer" class="example-container">
            <button id="exampleButton" class="example-button" type="button">
                ✨ Example Question
            </button>
        </div>

        <div id="status" class="status"></div>

        <section id="resultsSection" class="results-section">
            <h2 id="resultsTitle" class="results-title">Retrieved Evidence</h2>
            <div id="resultsContainer"></div>
        </section>

    </div>
</div>

<script>

/* =============================================================
   LOGIN STATE
   ============================================================= */

const TOKEN_KEY = "intentstore_token";
const EMAIL_KEY = "intentstore_email";

const authScreen   = document.getElementById("authScreen");
const appScreen    = document.getElementById("appScreen");
const authHeading  = document.getElementById("authHeading");
const authEmail    = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authButton   = document.getElementById("authButton");
const authMessage  = document.getElementById("authMessage");
const authSwitch   = document.getElementById("authSwitch");
const logoutButton = document.getElementById("logoutButton");
const userEmail    = document.getElementById("userEmail");

let signupMode = false;

function getToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ""; }
    catch (e) { return ""; }
}

function saveLogin(token, email) {
    try {
        localStorage.setItem(TOKEN_KEY, token);
        localStorage.setItem(EMAIL_KEY, email);
    } catch (e) {}
}

function clearLogin() {
    try {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(EMAIL_KEY);
    } catch (e) {}
}

function showAuthMessage(text, type) {
    authMessage.textContent = text;
    authMessage.className = "auth-message " + type;
}

function clearAuthMessage() {
    authMessage.textContent = "";
    authMessage.className = "auth-message";
}

function showLoginScreen() {
    authScreen.style.display = "block";
    appScreen.style.display = "none";
}

function showAppScreen() {
    authScreen.style.display = "none";
    appScreen.style.display = "block";

    let email = "";
    try { email = localStorage.getItem(EMAIL_KEY) || ""; } catch (e) {}
    userEmail.textContent = email;
}

function setSignupMode(on) {
    signupMode = on;
    clearAuthMessage();

    if (on) {
        authHeading.textContent = "Create account";
        authButton.textContent = "Sign up";
        authSwitch.textContent = "Already have an account? Log in";
    } else {
        authHeading.textContent = "Log in";
        authButton.textContent = "Log in";
        authSwitch.textContent = "New here? Create an account";
    }
}

authSwitch.addEventListener("click", function () {
    setSignupMode(!signupMode);
});

async function submitAuth() {

    const email = authEmail.value.trim();
    const password = authPassword.value;

    if (!email || !password) {
        showAuthMessage("Please enter your email and password.", "error");
        return;
    }

    authButton.disabled = true;
    clearAuthMessage();

    try {

        const url = signupMode ? "/api/signup" : "/api/login";

        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Something went wrong.");
        }

        if (signupMode) {
            setSignupMode(false);
            showAuthMessage("Account created. Now log in.", "success");
            authPassword.value = "";
        } else {
            saveLogin(data.token, email);
            authPassword.value = "";
            showAppScreen();
        }

    } catch (error) {
        showAuthMessage(error.message || "Something went wrong.", "error");
    }

    authButton.disabled = false;
}

authButton.addEventListener("click", submitAuth);

authPassword.addEventListener("keydown", function (event) {
    if (event.key === "Enter") { submitAuth(); }
});

logoutButton.addEventListener("click", function () {
    clearLogin();
    clearStatus();
    clearResults();
    questionInput.value = "";
    setSignupMode(false);
    showLoginScreen();
});

/*
 * Use this instead of fetch() for anything that needs login.
 * It attaches the token, and sends the user back to the
 * login screen if the server says they are not logged in.
 */
async function authFetch(url, options) {

    options = options || {};
    options.headers = Object.assign({}, options.headers || {}, {
        "Authorization": "Bearer " + getToken()
    });

    const response = await fetch(url, options);

    if (response.status === 401) {
        clearLogin();
        clearResults();
        showLoginScreen();
        showAuthMessage("Please log in again.", "error");
        throw new Error("Please log in first.");
    }

    return response;
}


/* =============================================================
   SEARCH PAGE
   ============================================================= */

const questionInput    = document.getElementById("questionInput");
const modeSelect       = document.getElementById("modeSelect");
const searchButton     = document.getElementById("searchButton");
const exampleButton    = document.getElementById("exampleButton");
const exampleContainer = document.getElementById("exampleContainer");
const statusBox        = document.getElementById("status");
const resultsSection   = document.getElementById("resultsSection");
const resultsTitle     = document.getElementById("resultsTitle");
const resultsContainer = document.getElementById("resultsContainer");

function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}

function clearStatus() {
    statusBox.textContent = "";
    statusBox.className = "status";
}

function clearResults() {
    resultsContainer.innerHTML = "";
    resultsSection.classList.remove("visible");
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function readJson(response) {
    const contentType = response.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) {
        throw new Error(
            "Backend returned HTML instead of JSON. " +
            "Make sure Flask is running from frontend/app.py."
        );
    }
    return await response.json();
}

/* MODE CHANGE (does not search) */

modeSelect.addEventListener("change", function () {

    clearStatus();
    clearResults();

    if (modeSelect.value === "document") {
        searchButton.textContent = "Find Document";
        questionInput.placeholder = "Enter document name...";
        exampleContainer.style.display = "none";
    } else {
        searchButton.textContent = "Search";
        questionInput.placeholder = "Search your knowledge base...";
        exampleContainer.style.display = "flex";
    }
});

/* EXAMPLE QUESTION (only fills the box, never searches) */

exampleButton.addEventListener("click", async function () {

    try {

        showStatus("Loading example question...", "loading");

        const response = await authFetch("/api/examples", {
            method: "GET",
            headers: { "Accept": "application/json" }
        });

        const data = await readJson(response);

        if (!data.success || !Array.isArray(data.questions) || data.questions.length === 0) {
            throw new Error("No example questions available.");
        }

        const i = Math.floor(Math.random() * data.questions.length);
        questionInput.value = data.questions[i];

        clearStatus();
        questionInput.focus();

    } catch (error) {
        showStatus(error.message || "Could not load example question.", "error");
    }
});

/* MAIN SEARCH BUTTON */

searchButton.addEventListener("click", async function () {

    const question = questionInput.value.trim();

    if (!question) {
        showStatus(
            modeSelect.value === "document"
                ? "Please enter a document name."
                : "Please enter a question.",
            "error"
        );
        questionInput.focus();
        return;
    }

    searchButton.disabled = true;
    clearResults();

    /* ---------------- INFORMATION RETRIEVAL ---------------- */

    if (modeSelect.value === "information") {

        searchButton.textContent = "Searching...";
        showStatus("Searching the knowledge base...", "loading");

        try {

            const response = await authFetch("/api/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ question: question })
            });

            const data = await readJson(response);

            if (!response.ok || !data.success) {
                throw new Error(data.error || data.answer || "Information retrieval failed.");
            }

            resultsTitle.textContent = "AI Answer";
            resultsContainer.innerHTML = "";

            const answerCard = document.createElement("div");
            answerCard.className = "answer-card";
            answerCard.innerHTML =
                '<div class="answer-heading">Answer</div>' +
                '<div class="answer-text">' + escapeHtml(data.answer || "") + '</div>';
            resultsContainer.appendChild(answerCard);

            if (Array.isArray(data.results) && data.results.length > 0) {

                const heading = document.createElement("div");
                heading.style.fontSize = "32px";
                heading.style.fontWeight = "700";
                heading.style.margin = "25px 0";
                heading.textContent = "Retrieved Evidence";
                resultsContainer.appendChild(heading);

                data.results.forEach(function (result) {

                    const card = document.createElement("div");
                    card.className = "evidence-card";

                    card.innerHTML =
                        '<div class="document-name">📄 ' +
                            escapeHtml(result.filename || "Unknown document") +
                        '</div>' +
                        '<div class="document-info">Page: ' +
                            escapeHtml(String(result.page_number ?? "Unknown")) +
                            ' &nbsp;|&nbsp; Chunk: ' +
                            escapeHtml(String(result.chunk_number ?? "Unknown")) +
                            ' &nbsp;|&nbsp; Relevance: ' +
                            escapeHtml(String(result.relevance_score ?? result.similarity_score ?? 0)) +
                        '</div>' +
                        '<div class="evidence-text">' +
                            escapeHtml(result.text || "") +
                        '</div>';

                    resultsContainer.appendChild(card);
                });
            }

            resultsSection.classList.add("visible");
            showStatus("Search completed successfully.", "success");

        } catch (error) {
            showStatus(error.message || "Information retrieval failed.", "error");
        }

        searchButton.disabled = false;
        searchButton.textContent = "Search";
        return;
    }

    /* ---------------- DOCUMENT RETRIEVAL ---------------- */

    if (modeSelect.value === "document") {

        searchButton.textContent = "Finding...";
        showStatus("Searching for the requested document...", "loading");

        try {

            const response = await authFetch("/api/search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ query: question })
            });

            const data = await readJson(response);

            if (!response.ok || !data.success) {
                throw new Error(data.error || "Document retrieval failed.");
            }

            if (!Array.isArray(data.results) || data.results.length === 0) {

                resultsTitle.textContent = "Document Retrieval";
                resultsContainer.innerHTML =
                    '<div class="no-results">No matching document was found for: <strong>' +
                    escapeHtml(question) + '</strong></div>';
                resultsSection.classList.add("visible");
                showStatus("No matching document found.", "error");

            } else {

                resultsTitle.textContent = "Retrieved Document";
                resultsContainer.innerHTML = "";

                data.results.forEach(function (result, index) {

                    const card = document.createElement("div");
                    card.className = "document-result";

                    card.innerHTML =
                        '<h3>📄 ' + escapeHtml(result.filename || "Unknown document") + '</h3>' +
                        '<p><strong>Result:</strong> ' + (index + 1) + '</p>' +
                        '<p><strong>Page:</strong> ' +
                            escapeHtml(String(result.page_number ?? "Unknown")) + '</p>' +
                        '<p><strong>Chunk:</strong> ' +
                            escapeHtml(String(result.chunk_number ?? "Unknown")) + '</p>' +
                        '<p><strong>Relevance:</strong> ' +
                            escapeHtml(String(result.relevance_score ?? result.similarity_score ?? 0)) + '</p>' +
                        '<hr>' +
                        '<p><strong>Retrieved Content:</strong></p>' +
                        '<p>' + escapeHtml(result.text || "No text available.") + '</p>';

                    resultsContainer.appendChild(card);
                });

                resultsSection.classList.add("visible");
                showStatus("Document retrieved successfully.", "success");
            }

        } catch (error) {
            showStatus(error.message || "Document retrieval failed.", "error");
        }

        searchButton.disabled = false;
        searchButton.textContent = "Find Document";
    }
});

/* ENTER KEY (typing or pasting never searches by itself) */

questionInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        searchButton.click();
    }
});


/* =============================================================
   START: show login screen or main page
   ============================================================= */

clearStatus();
clearResults();

if (getToken()) {
    showAppScreen();
} else {
    showLoginScreen();
}

</script>
</body>
</html>
